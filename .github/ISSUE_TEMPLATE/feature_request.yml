name: Feature request
description: Suggest an improvement or a new feature
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before submitting, please check the roadmap in the README, since some ideas are already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have thought about, if any.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Dwell keeps all data local and makes no network requests. Please confirm that your idea fits this.
      options:
        - label: My proposal does not require sending data off the device or storing URLs or browsing history.
          required: true
