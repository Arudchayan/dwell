name: Bug report
description: Report a problem with Dwell
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not include personal browsing URLs. Dwell does not store them, so describing the affected domain is enough.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Where you are running Dwell, for example Chrome 131, Edge 131, Brave 1.73, or Firefox 132.
      placeholder: Chrome 131
    validations:
      required: true
  - type: input
    id: dwell-version
    attributes:
      label: Dwell version
      description: Shown on the extensions page (chrome://extensions, edge://extensions, brave://extensions, or about:addons).
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that reproduces the problem.
      placeholder: |
        1. Open the Dwell dashboard
        2. Create a limit for example.com
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Include any error messages.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, console output, or anything else that might help.
    validations:
      required: false
